name: Build abinit-fallbacks with oneapi

on:
  push:
    branches: [actions]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
    - name: Checkout abinit-fallbacks repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y autoconf automake m4
        sudo apt install -y libxml2-dev
        sudo apt install -y build-essential zlib1g-dev

        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
        | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list

        sudo apt update
        # Install only the needed components, all from the latest release:
        # the toolkit meta packages may mix versions (hpc-toolkit 2025.3 pins
        # ifx 2025.3 while icx is 2026.1), and setvars.sh then only puts the
        # latest compiler directory, without ifx, in the PATH
        sudo apt install -y intel-oneapi-compiler-fortran intel-oneapi-compiler-dpcpp-cpp \
                            intel-oneapi-mpi-devel intel-oneapi-mkl-devel
        source /opt/intel/oneapi/setvars.sh

        printenv >> $GITHUB_ENV

    - name: Run autogen
      run: ./autogen.sh

    - name: Run configure
      run: |
        mkdir -p build
        cd build
        ../configure --prefix=$HOME

    - name: Run make
      run: |
        cd build
        make
